<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato | Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="shortcut icon" href="img/zomato.png" type="image/x-icon">
</head>

<body>

    <header>
        <div>
            <img src="img/logo.png" alt="logo">
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="relation.html">Investor</a></li>
            <li><a href="restaurant.html">Add Restaurant</a></li>
            <li><a href="signup.html">Signup</a></li>
        </ul>
    </header>

    <main>

        <!-- HERO -->
        <section class="hero">
            <img src="img/logo.png" alt="logo">
            <h1>Welcome Back</h1>
            <p>Login to continue</p>
        </section>

        <!-- LOGIN FORM -->
        <section class="login-section">
            <div class="login-box">
                <h2>Login</h2>

                <form id="loginForm">
                    <input type="email" placeholder="Email Address" required>
                    <input type="password" placeholder="Password" required>

                    <div class="options">
                        <label>
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="Rtxt">Forgot Password?</a>
                    </div>

                    <button type="submit">Login</button>

                    <p class="signup-text">
                        Don't have an account? <a href="#">Signup</a>
                    </p>
                </form>
            </div>
        </section>

    </main>

    <footer>
        Copyright &copy; 2026 | All rights reserved
    </footer>

    <script src="js/login.js"></script>
</body>

</html>
