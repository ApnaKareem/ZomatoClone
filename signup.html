<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato | Signup</title>
    <link rel="stylesheet" href="css/signup.css">
    <link rel="shortcut icon" href="img/zomato.png" type="image/x-icon">
</head>

<body>

    <header>
        <div> <img src="img/logo.png" alt="logo"> </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="relation.html">Investor</a></li>
            <li><a href="restaurant.html">Add Restaurant</a></li>
            <li><a href="login.html">Login</a></li>
        </ul>
    </header>

    <main>

        <!-- HERO -->
        <section class="hero">
            <img src="img/logo.png" alt="logo">
            <h1>Create Account</h1>
            <p>Join us and explore amazing food</p>
        </section>

        <!-- SIGNUP FORM -->
        <section class="signup-section">
            <div class="signup-box">
                <h2>Signup</h2>

                <form id="signupForm">

                    <input type="text" placeholder="Full Name" required>
                    <input type="email" placeholder="Email Address" required>
                    <input type="password" placeholder="Password" required>
                    <input type="password" placeholder="Confirm Password" required>

                    <label class="terms">
                        <input type="checkbox" required>
                        <span>I agree to the Terms & Conditions</span>
                    </label>

                    <button type="submit">Create Account</button>

                    <p class="login-text">
                        Already have an account? <a href="login.html">Login</a>
                    </p>

                </form>
            </div>
        </section>

    </main>

    <footer>
        Copyright &copy; 2026 | All rights reserved
    </footer>

    <script src="js/signup.js"></script>
</body>

</html>
